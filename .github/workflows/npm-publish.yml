# Tag-triggered lockstep publish for the @orpc-ws/* family.
#
# Publishing happens ONLY when a version tag (`v*`, e.g. `v0.2.0`) is pushed.
# Pushing/merging to `main` NEVER publishes — push to main as much as you want.
#
# To cut a release (all 8 packages move together — see `fixed` in
# .changeset/config.json):
#   1. pnpm version-packages      # = `changeset version`: consumes .changeset/*.md,
#                                  #   bumps all 8 in lockstep, rewrites workspace:*
#                                  #   deps, writes CHANGELOG.md
#   2. git commit -am "release: vX.Y.Z" && git push        # land bumps on main
#   3. git tag vX.Y.Z && git push origin vX.Y.Z            # <-- THIS publishes
#
# DO NOT RENAME THIS FILE. npmjs.org trusted-publisher bindings for all eight
# packages are bound to the workflow filename `npm-publish.yml`; renaming it
# breaks OIDC authorization and publishes will 404. (The trusted-publisher
# check matches on repo + workflow filename, NOT on branch/ref, so a
# tag-triggered run authorizes exactly like the old branch-triggered one.)

name: Publish to npm (@orpc-ws)

on:
  push:
    tags:
      - "v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read       # checkout the tagged commit
  id-token: write      # npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22" # floor ≥22.22 (react-router v8 engines.node >=22.22.0)
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Build before publish
        run: pnpm exec turbo run build

      - name: Publish to npm (lockstep, OIDC trusted publishing)
        # `pnpm -r publish` publishes every non-private workspace package whose
        # version is not yet on the registry (so re-running a tag is a safe
        # no-op), rewrites workspace:* -> the exact published version, and skips
        # the private @demo/* demo apps. Each package carries
        # publishConfig.access=public. --no-git-checks: CI runs on a detached
        # tag checkout, so pnpm's default clean-tree/branch checks don't apply.
        run: pnpm -r publish --no-git-checks
        # Deliberately NO NPM_TOKEN / NODE_AUTH_TOKEN: leaving it unset is what
        # selects npm OIDC trusted publishing (a present-but-empty token would
        # bypass OIDC and 404). Provenance is automatic under trusted publishing.
