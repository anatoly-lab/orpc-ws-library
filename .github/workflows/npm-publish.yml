# Lockstep publish for the @orpc-ws/* family, driven by Changesets.
#
# Two-phase flow (changesets/action):
#   1. Push to main with unreleased .changeset/*.md files → the action opens (or
#      updates) a "Version Packages" PR that runs `changeset version`: it bumps
#      all seven packages in lockstep (config `fixed`), rewrites internal
#      `workspace:*` deps, and updates each CHANGELOG.md.
#   2. Merge that PR → the action's `publish` step runs `changeset publish`,
#      which delegates to `pnpm publish` per package (resolving `workspace:*`
#      to the exact just-bumped version), publishes via npm OIDC trusted
#      publishing + provenance, pushes git tags, and creates GitHub Releases.
#
# DO NOT RENAME THIS FILE. npmjs.org trusted-publisher bindings for all seven
# packages are bound to the workflow filename `npm-publish.yml`; renaming it
# breaks OIDC authorization and publishes will 404.

name: Publish to npm (@orpc-ws)

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write        # commit the Version Packages PR, git tags, GH releases
  pull-requests: write   # open/update the Version Packages PR
  id-token: write        # npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changesets needs full history vs baseBranch

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # latest 22.x: clears OIDC floor (>=22.14) AND undici/testcontainers (>=22.19)
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build before publish
        run: pnpm exec turbo run build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately NO NPM_TOKEN / NODE_AUTH_TOKEN. Leaving it UNSET is what
          # selects npm OIDC trusted publishing (a present-but-empty token would
          # bypass OIDC and 404). Provenance is automatic under trusted publishing.
