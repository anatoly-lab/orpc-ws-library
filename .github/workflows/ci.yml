name: CI

on:
  push:
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + test + build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Lint + typecheck + test + build
        run: pnpm exec turbo run lint typecheck test build

  e2e:
    name: Playwright E2E (Keycloak + demo app)
    runs-on: ubuntu-latest
    # Heavier than the unit job: globalSetup builds the demo-server + demo-spa
    # Docker images and brings the whole stack (Keycloak + server + spa) up as
    # containers on one network, then drives the real Chromium login flow.
    # Runs in parallel with `verify`. ubuntu-latest ships Docker, so no extra
    # services/setup are needed. (No host turbo build: the images build
    # everything internally via `turbo prune`, and the `verify` job already
    # validates the host build.)

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (with Playwright browser)
        # Allow the @repo/tests-e2e postinstall to download Chromium normally.
        # The `--with-deps` flag installs OS-level browser dependencies via apt.
        run: pnpm install --frozen-lockfile

      - name: Ensure Playwright Chromium + OS deps
        # Belt-and-suspenders: postinstall in tests-e2e tries `--with-deps`
        # then falls back; we explicitly call here so OS deps land.
        working-directory: tests-e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        # globalSetup docker-builds the app images (Docker layer cache makes
        # warm runs fast) and starts the containerized stack. CI=true gives the
        # Playwright config its retry budget.
        working-directory: tests-e2e
        run: pnpm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests-e2e/playwright-report/
            tests-e2e/test-results/
            tests-e2e/junit.xml
          retention-days: 14
          if-no-files-found: ignore
