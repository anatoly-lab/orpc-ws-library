server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback — every non-file route serves index.html so
    # client-side routing (the OIDC /callback route, etc.) works on
    # direct navigation / reload.
    location / {
        try_files $uri /index.html;
    }

    # Readiness probe for container gating. Plain 200, no IdP dependency.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
