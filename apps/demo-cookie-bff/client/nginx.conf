server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback — every non-file route serves index.html so
    # client-side routing works on direct navigation / reload. The
    # cookie-BFF SPA's OAuth callback is a SERVER endpoint (/auth/callback
    # on :18083), not a SPA route, so the browser only ever lands back here
    # on the SPA root — but the fallback keeps reloads of any in-app path
    # working all the same.
    location / {
        try_files $uri /index.html;
    }

    # Readiness probe for container gating. Plain 200, no server dependency.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
